# Every push to main builds a signed APK (downloadable from the run's artifacts).
# Pushing a tag like v0.2.0 also publishes it as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# Don't run two builds of the same branch/tag at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag must look like v1.2.3 (minor and patch below 100)"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Never publish a debug-signed build: users couldn't update from it.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets"; exit 1
          fi
          mkdir -p .signing
          echo "$KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.1; fi
          ./gradlew assembleRelease -PappVersion="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "cascade-$VERSION.apk"
          rm -f .signing/release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: cascade-apk
          path: cascade-*.apk

      # Re-running a release job replaces the APK instead of failing.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" cascade-*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" cascade-*.apk --title "Cascade ${GITHUB_REF_NAME#v}" --generate-notes
          fi
