// Compose stability configuration (composeCompiler.stabilityConfigurationFiles in build.gradle.kts).
// Each type here is one the compiler can't prove immutable. Listing it makes parameters of that type, and data classes
// holding it (AppEntry, AppNotification, LiveTimer, NowPlayingState, LauncherSettings), compare by equals() so equal
// values skip recomposition. Only list a type nothing in the app mutates after handing it to the UI.

// Read-only collections, stable when their elements are (<*> keeps the element in the check). Every list, map and set
// the UI gets is a snapshot that is replaced, never changed in place: StateFlow values, remembered results, data class
// copies. Mutable collections (MutableList, HashMap as itself) stay unstable.
kotlin.collections.List<*>
kotlin.collections.Set<*>
kotlin.collections.Map<*,*>

// Immutable after construction, with value equals().
android.content.ComponentName
android.os.UserHandle
// Equal when they stand for the same system-side intent; the app never changes one.
android.app.PendingIntent
// A handle on one media session's controls with no state of its own; equals() is identity.
android.media.session.MediaController.TransportControls
// An interface, so the compiler can't infer it. equals() is identity, and nothing draws into a bitmap once it's shown:
// icons and album art are rendered once and replaced, never redrawn.
androidx.compose.ui.graphics.ImageBitmap
